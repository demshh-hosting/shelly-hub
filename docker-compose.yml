services:
  shelly-hub:
    build: .
    image: shelly-hub:latest
    container_name: shelly-hub
    restart: unless-stopped
    ports:
      - "80:8080"            # Dashboard: http://192.168.80.12
    environment:
      TZ: Europe/Zurich
      SCAN_SUBNETS: "192.168.70.0/24"   # Netz(e) mit deinen Shellys, mehrere mit Komma
      POLL_INTERVAL: "30"               # Status-Abfrage in Sekunden
      SCAN_INTERVAL: "60"               # Automatischer Netzwerk-Scan in Minuten
      # SHELLY_PASSWORD: ""             # Falls deine Shellys ein Passwort haben
      # APP_PASSWORD: ""                # Login fürs Dashboard (Benutzer: admin)
      # DEMO: "1"                       # Demo-Modus mit Beispielgeräten
    volumes:
      - ./data:/data
